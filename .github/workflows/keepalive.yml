# Free Supabase projects are paused after about a week without activity, which takes login and
# every map offline. A read-only query every 3 days did not prevent a pause in October 2026, so
# this now runs daily and calls keepalive(), which writes to the database (migration
# 20261101000000_keepalive.sql). The owner's notebook runs the same ping as a second source,
# since GitHub disables scheduled workflows after 60 days without commits. If the project is
# paused anyway, the run fails and GitHub e-mails the owner: resume it at supabase.com/dashboard.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secrets do Supabase não configurados."
            exit 1
          fi
          # keepalive() updates one fixed row: a real write, with no input from the caller.
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 -m 30 \
            -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}') || status="sem resposta"
          if [ "$status" = "404" ]; then
            echo "::warning::keepalive() não existe: aplique a migração 20261101000000_keepalive.sql. Usando a consulta de leitura."
            status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 -m 30 \
              "$VITE_SUPABASE_URL/rest/v1/plans?select=id&limit=1" \
              -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY") || status="sem resposta"
          fi
          echo "Resposta do Supabase: $status"
          if [ "$status" != "200" ]; then
            echo "::error title=Supabase fora do ar::O projeto não respondeu ($status). Se estiver pausado, restaure em https://supabase.com/dashboard."
            exit 1
          fi
